[package]
name = "model-collaboration-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Budgeted in-process model collaboration for Python agents"
license = "MIT"

[lib]
name = "model_collaboration_engine"
crate-type = ["rlib", "cdylib"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
async-openai = { version = "=0.42.0", default-features = false, features = ["chat-completion-types", "response-types"] }
async-trait = "0.1"
futures-util = "0.3"
fs2 = "0.4"
file-id = "0.2.3"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29", optional = true, features = ["tokio-runtime"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.40.1", features = ["i128_blob"] }
serde = { version = "1", features = ["derive"] }
# Persisted routing snapshots must preserve f64 bits and their content digest on reload.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-rusqlite = "=0.8.0"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
