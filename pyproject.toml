[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "model-collaboration-engine"
version = "0.1.0"
description = "Rust-powered model coordination for Python agents"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
lint = ["ruff==0.15.22"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python"]
include = ["python/**/*.py", "examples/**/*.py", "tests/python/**/*.py", "pyproject.toml"]
extend-exclude = ["target", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["model_collaboration_engine"]

[tool.maturin]
python-source = "python"
module-name = "model_collaboration_engine._native"
features = ["extension-module", "bundled-sqlite"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
