name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test Rust
        run: cargo +stable test --locked --all-features
      - name: Lint Rust
        run: cargo +stable clippy --locked --all-features --all-targets -- -D warnings
      - name: Build and install Python package with check dependencies
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python -m pip install ".[test,lint]"
      - name: Lint Python
        run: python -m ruff check .
      - name: Test installed Python package
        run: python -m pytest
