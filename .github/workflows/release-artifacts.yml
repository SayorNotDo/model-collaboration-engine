name: Release artifacts (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install build tools
        run: python -m pip install "maturin>=1.9,<2" twine
      - name: Check package versions and license
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert cargo["version"] == project["version"], "Package versions differ"
          assert cargo["license"] == project["license"] == "MIT"
          assert pathlib.Path("LICENSE").is_file(), "LICENSE is missing"
          PY
      - name: Build host-native wheel
        run: python -m maturin build --release --locked --compatibility off --out dist
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: python -m maturin sdist --out dist
      - name: Inspect source distribution
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          archive_path, = pathlib.Path("dist").glob("*.tar.gz")
          with tarfile.open(archive_path) as archive:
              names = [pathlib.PurePosixPath(name) for name in archive.getnames()]
          required = {
              "Cargo.toml", "Cargo.lock", "pyproject.toml", "README.md", "LICENSE",
              "src/lib.rs", "python/model_collaboration_engine/__init__.py",
          }
          relative = {str(pathlib.PurePosixPath(*name.parts[1:])) for name in names}
          assert required <= relative, required - relative
          forbidden = [
              name for name in names
              if "artifacts" in name.parts or name.name == ".env"
              or (name.name.startswith(".env.") and name.name != ".env.example")
              or name.suffix == ".db"
          ]
          assert not forbidden, forbidden
          PY
      - name: Rebuild wheel from source distribution
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir rebuilt dist/*.tar.gz
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel and declared test dependencies
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          directory = pathlib.Path("rebuilt") if pathlib.Path("rebuilt").exists() else pathlib.Path("dist")
          wheels = list(directory.glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheels[0]) + "[test]"], check=True)
          PY
      - name: Test installed wheel
        run: python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
